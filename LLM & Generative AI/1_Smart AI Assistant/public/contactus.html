<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Smart AI Assistant</title>
  <link rel="icon" href="brainimg.ico" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="./index.html" class="nav-brand">Smart AI Workspace</a>
    <ul class="nav-links">
      <li><a href="./index.html">AI Chat</a></li>
      <li><a href="./aboutus.html">About Us</a></li>
      <li><a href="./contactus.html" class="active">Contact Us</a></li>
    </ul>
  </nav>

  <div class="main-container">
    <header>
      <h1>Contact Us</h1>
      <p>Have questions or feedback? Get in touch with us.</p>
    </header>

    <main class="card">
      <form onsubmit="handleContactSubmit(event)">
        <div class="form-group">
          <label for="contactName">Full Name</label>
          <input type="text" id="contactName" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="contactEmail">Email Address</label>
          <input type="email" id="contactEmail" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" rows="5" placeholder="Type your message here..." required></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </main>
  </div>

  <footer>
    <p>&copy; 2026 Smart AI Assistant. Built with Python, Flask & Vanilla Web Technologies.</p>
  </footer>

  <script src="./scripts.js"></script>
</body>
</html>
